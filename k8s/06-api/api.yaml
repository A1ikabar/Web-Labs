apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: wp-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: wp-labs/api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4200
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4200
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: wp-labs
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 4200
      targetPort: 4200
  type: ClusterIP
