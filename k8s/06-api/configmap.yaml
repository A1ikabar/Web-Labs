apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: wp-labs
data:
  DEBUG: "True"
  ALLOWED_HOSTS: "*"

  DB_NAME: "wp_labs"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_TTL_DEFAULT: "300"

  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "wp-labs-files"
  MINIO_USE_SSL: "false"
  MAX_FILE_SIZE: "10485760"

  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_EXCHANGE: "app.events"
  RABBITMQ_DLX: "app.dlx"
  QUEUE_USER_REGISTERED: "wp.auth.user.registered"

  JWT_ACCESS_EXPIRATION_MINUTES: "15"
  JWT_REFRESH_EXPIRATION_DAYS: "7"

  LOGIN_URL: "http://127.0.0.1:4200"
  YANDEX_REDIRECT_URI: "http://127.0.0.1:4200/auth/oauth/yandex/callback"
