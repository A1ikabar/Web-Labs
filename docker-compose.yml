version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: wp_labs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student_secure_password
      POSTGRES_DB: wp_labs
    ports:
      - "5433:5432"
    volumes:
      - wp_labs_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wp_labs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wp_labs_redis:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes

volumes:
  wp_labs_postgres:
  wp_labs_redis:
